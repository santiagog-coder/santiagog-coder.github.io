<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Santiago Guepud · Contacto digital y presencia personal.">
  <meta name="theme-color" content="#ff6a00">

  <!-- Open Graph -->
  <meta property="og:title" content="Santiago Guepud">
  <meta property="og:description" content="Contacto digital y presencia personal.">
  <meta property="og:image" content="https://santiagoguepud.com/ogpreview.png">
  <meta property="og:url" content="https://santiagoguepud.com">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Santiago Guepud">
  <meta name="twitter:description" content="Contacto digital y presencia personal.">
  <meta name="twitter:image" content="https://santiagoguepud.com/ogpreview.png">

  <title>Santiago Guepud</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d11;
      --card-bg: rgba(22, 24, 32, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 106, 0, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #ff6a00;
      --orange-bright: #ff8533;
      --orange-glow: rgba(255, 106, 0, 0.3);
      --surface-btn: rgba(255, 255, 255, 0.04);
      --surface-btn-hover: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo dinámico con orbes de gradiente ambiental */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      animation: float 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
      top: -100px;
      right: -80px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #b84300 0%, transparent 70%);
      bottom: -150px;
      left: -120px;
      animation-duration: 18s;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    /* Tarjeta principal con soporte panorámico y móvil */
    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 780px; /* Ya no es una simple tirita vertical */
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 36px;
      padding: 56px 44px 40px;
      box-shadow: 
        0 24px 60px -15px rgba(0, 0, 0, 0.6),
        0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
      transition: border-color 0.4s ease;
    }

    .wrapper:hover {
      border-color: rgba(255, 106, 0, 0.2);
    }

    /* Layout interno flexible */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 44px;
    }

    .monogram-badge {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      background: linear-gradient(145deg, #1f222e, #14161f);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .monogram-badge span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.04em;
    }

    .badge-glow {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--orange);
      border-radius: 50%;
      bottom: -2px;
      right: -2px;
      box-shadow: 0 0 12px var(--orange);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
      display: inline-block;
    }

    /* Grid de botones e interacción */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (min-width: 640px) {
      .actions-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .btn-primary-hero {
        grid-column: span 2;
      }
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 24px;
      border-radius: 20px;
      font-size: 0.98rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Botón Hero: Guardar contacto */
    .btn-primary-hero {
      background: linear-gradient(135deg, var(--orange) 0%, #d95500 100%);
      color: #ffffff;
      box-shadow: 0 10px 28px var(--orange-glow);
      border: none;
      font-size: 1.05rem;
    }

    .btn-primary-hero:hover {
      background: linear-gradient(135deg, var(--orange-bright) 0%, var(--orange) 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(255, 106, 0, 0.45);
    }

    /* Botones de canales secundarios */
    .btn-action {
      background: var(--surface-btn);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-action:hover {
      background: var(--surface-btn-hover);
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
    }

    .btn-action svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      opacity: 0.85;
      transition: transform 0.2s ease;
    }

    .btn-action:hover svg {
      transform: scale(1.1);
      opacity: 1;
    }

    /* Footer sutil */
    footer {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }

    @media (max-width: 640px) {
      .wrapper {
        padding: 40px 24px 28px;
        border-radius: 28px;
      }
    }
  </style>
</head>
<body>

  <!-- Elementos de fondo ambiental -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

  <div class="grid-overlay"></div>

  <!-- Contenedor de tarjeta -->

      <a href="https://instagram.com/santiago.guepud" target="_blank" rel="noopener noreferrer" class="btn btn-action">

        Instagram

      <!-- Correo electrónico -->
      <a href="mailto:hey@santiagoguepud.com" class="btn btn-action" style="grid-column: span 1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        hey@santiagoguepud.com
      </a>
    </div>

    <footer>
      santiagoguepud.com
    </footer>
  </main>

  <script>
    // Cálculo dinámico de edad (20 de septiembre de 2004)
    (function computeAge() {
      const birth = new Date(2004, 8, 20); // Septiembre es mes 8 (base 0)
      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      const diff = now.getMonth() - birth.getMonth();
      if (diff < 0 || (diff === 0 && now.getDate() < birth.getDate())) {
        age--;
      }
      document.getElementById('user-age').textContent = `${age} años`;
    })();

    // Vibración háptica en dispositivos móviles al tocar botones
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        if ('vibrate' in navigator) {
          navigator.vibrate(25);
        }
      });
    });
  </script>

</body>
</html>
